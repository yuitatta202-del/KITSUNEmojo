    <title>Kitsune Mojo | Node Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body {
            background-color: #050505;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        
        /* Glass Nav (stile identico a index.html) */
        .glass-nav {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1f2937;
        }
        
        /* Progress bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: #f6851b;
            box-shadow: 0 0 10px rgba(246, 133, 27, 0.5);
            z-index: 60;
            transition: width 0.1s;
        }
        
        /* Card stile Mojo (come le card dell'index) */
        .mojo-card {
            background: #0a0a0a;
            border: 1px solid #1f2937;
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }
        .mojo-card:hover {
            border-color: #f6851b;
            box-shadow: 0 10px 30px -10px rgba(246, 133, 27, 0.2);
        }
        
        /* Tag pills (come nell'index) */
        .tag-pill {
            background: #111;
            border: 1px solid #1f2937;
            color: #9ca3af;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .tag-pill:hover {
            border-color: #f6851b;
            color: #f6851b;
            background: rgba(246, 133, 27, 0.05);
        }
        
        /* Badge arancione (come nell'index) */
        .mojo-badge {
            background: #f6851b;
            color: white;
            font-weight: 900;
            padding: 0.25rem 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        /* Info chip (stile stats-card dell'index) */
        .info-chip {
            background: linear-gradient(145deg, #0a0a0a 0%, #050505 100%);
            border: 1px solid rgba(246, 133, 27, 0.1);
            border-radius: 1rem;
            padding: 0.5rem 1rem;
        }
        
        /* Immagini manga */
        .manga-image {
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            display: block;
            border-radius: 1rem;
            box-shadow: 0 20px 40px -15px #000;
            transition: all 0.3s;
        }
        .manga-image:hover {
            transform: scale(1.01);
            box-shadow: 0 25px 50px -15px rgba(246, 133, 27, 0.3);
        }
        
        .page-node {
            scroll-margin-top: 120px;
            margin-bottom: 2rem;
        }
        
        /* Vote Buttons */
        .vote-button {
            background: #0a0a0a;
            border: 1px solid #1f2937;
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .vote-button:hover {
            border-color: #f6851b;
            background: rgba(246, 133, 27, 0.05);
        }
        .vote-button.up.active {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }
        .vote-button.down.active {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }
        .vote-score {
            font-size: 1.2rem;
            font-weight: 900;
            color: #f6851b;
            min-width: 40px;
            text-align: center;
        }
        
        /* Scrollbar (come index) */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #f6851b;
            border-radius: 10px;
        }
        
        /* Animazioni */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        /* Dropdown tags */
        .tags-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            width: 320px;
            background: #0a0a0a;
            border: 1px solid #1f2937;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-top: 0.75rem;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s;
            box-shadow: 0 20px 40px -15px #000;
            z-index: 100;
        }
        .tags-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        /* Mobile toggle */
        .mobile-toggle {
            background: #0a0a0a;
            border: 1px solid #1f2937;
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            font-size: 0.7rem;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mobile-toggle:hover {
            border-color: #f6851b;
            color: #f6851b;
        }
        
        /* Nascondi info section */
        .info-section {
            transition: all 0.3s ease;
        }
        .info-section.hidden-mobile {
            opacity: 0;
            visibility: hidden;
            height: 0;
            padding: 0;
            margin: 0;
            pointer-events: none;
        }
        
        /* Wallet connection indicator */
        .wallet-badge {
            background: #0a0a0a;
            border: 1px solid #f6851b;
            border-radius: 30px;
            padding: 0.25rem 0.75rem;
            font-size: 0.6rem;
            font-weight: 700;
            color: #f6851b;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .desktop-only {
                display: none;
            }
            .manga-image {
                border-radius: 0.5rem;
            }
            .vote-section {
                margin-top: 1rem;
            }
        }

        /* Comment styles */
        .comment {
            transition: all 0.2s ease;
        }
        .comment:hover {
            border-color: rgba(246, 133, 27, 0.3);
        }
        #mention-suggestions {
            position: absolute;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
        }
        .mention-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        .mention-item:hover {
            background: #333;
        }
        .mention-item:last-child {
            border-bottom: none;
        }
        .prose a {
            color: #f6851b;
            text-decoration: none;
        }
        .prose a:hover {
            text-decoration: underline;
        }
        
        /* Loading spinner for comments */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(246, 133, 27, 0.3);
            border-radius: 50%;
            border-top-color: #f6851b;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Connection status indicator */
        .connection-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #0a0a0a;
            border: 1px solid #1f2937;
            border-radius: 30px;
            padding: 0.5rem 1rem;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 100;
            opacity: 0.8;
            backdrop-filter: blur(5px);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f6851b;
            animation: pulse 2s infinite;
        }
        .status-dot.connected {
            background: #10b981;
            animation: none;
        }
        .status-dot.disconnected {
            background: #ef4444;
            animation: none;
        }
    </style>
</head>
<body>

    <div id="progress-bar" class="progress-bar" style="width: 0%"></div>

    <!-- Connection Status Indicator (NOVITÀ) -->

    <!-- HEADER INFO (stile index) -->
    <header class="pt-6 px-6">
        <div class="max-w-7xl mx-auto">
            <!-- Titolo e mobile toggle -->

            <!-- Badge rapidi (lingua + categoria) -->

    <!-- INFO SECTION (nascondibile su mobile) -->

        <div class="max-w-7xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <!-- Artist card -->
                <div id="artist-card" class="info-chip hidden">
                    <span class="text-gray-600 text-[9px] font-black uppercase tracking-widest block mb-1">Artista</span>

                <!-- Pages card -->

                    <span class="text-gray-600 text-[9px] font-black uppercase tracking-widest block mb-1">Nodi</span>
                    <div class="flex items-center gap-2">
                        <i class="fas fa-book-open text-orange-500 text-xs"></i>

                </div>
                
                <!-- Votes card -->
                <div class="info-chip">
                    <span class="text-gray-600 text-[9px] font-black uppercase tracking-widest block mb-1">Voti</span>
                    <div class="flex items-center gap-2">

                <!-- Tags card con dropdown -->

                    <span class="text-gray-600 text-[9px] font-black uppercase tracking-widest block mb-1">Metadata</span>
                    <button id="tags-button" class="flex items-center gap-2 w-full text-left">

    <!-- COMMENTS SECTION (POSIZIONE CORRETTA) -->

        <i class="fas fa-chevron-up"></i>
    </button>

    <script>
        // ============================================
        // CONFIGURAZIONE - Versione produzione CORRETTA
        // ============================================

        // Determina l'URL base in base all'ambiente
        const BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000' 
            : 'https://kitsune-backend.onrender.com';  // ← URL CORRETTO DEL BACKEND

        const PROXY_URL = `${BASE_URL}/admin/proxy?url=`;
        const API_URL = `${BASE_URL}/admin`;
        const READER_API = `${BASE_URL}/reader`;
        const COMMENTS_API = `${BASE_URL}/comments`;

        const params = new URLSearchParams(window.location.search);
        const mangaId = params.get('id');

        // Log per debug
        console.log('🔧 Environment:', window.location.hostname === 'localhost' ? 'development' : 'production');
        console.log('🔧 BASE_URL:', BASE_URL);
        console.log('🔧 mangaId:', mangaId);

        // ============================================
        // VERIFICA CONNESSIONE BACKEND (NOVITÀ)
        // ============================================
        async function checkBackendConnection() {
            const statusEl = document.getElementById('connection-status');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            
            if (!statusEl || !statusDot || !statusText) return;
            
            statusEl.classList.remove('hidden');
            
            try {
                const res = await fetch(`${BASE_URL}/api/status`);
                if (res.ok) {
                    console.log('✅ Backend connected');
                    statusDot.className = 'status-dot connected';
                    statusText.innerText = 'Backend Online';
                    statusText.className = 'text-green-500';
                    
                    // Nascondi dopo 3 secondi
                    setTimeout(() => {
                        statusEl.classList.add('hidden');
                    }, 3000);
                } else {
                    console.warn('⚠️ Backend returned:', res.status);
                    statusDot.className = 'status-dot disconnected';
                    statusText.innerText = 'Backend Error';
                    statusText.className = 'text-red-500';
                }
            } catch (err) {
                console.error('❌ Backend connection failed:', err);
                statusDot.className = 'status-dot disconnected';
                statusText.innerText = 'Backend Offline';
                statusText.className = 'text-red-500';
            }
        }

        // ============================================
        // STATO GLOBALE
        // ============================================
        let userWallet = null;
        let readingSessionId = null;
        let currentPage = 1;
        let totalPagesCount = 1;
        let currentVotes = { upvotes: 0, downvotes: 0, userVote: null };
        let currentBookmark = null;

        // ============================================
        // WALLET CONNECTION
        // ============================================
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userWallet = accounts[0].toLowerCase();
                    
                    document.getElementById('connect-wallet-btn').classList.add('hidden');
                    document.getElementById('wallet-container').classList.remove('hidden');
                    document.getElementById('wallet-address').innerText =

        // ============================================
        // VOTE FUNCTIONS (CORRETTE)
        // ============================================
        async function loadVoteStatus() {
            if (!mangaId) return;
            
            try {
                const url = `${READER_API}/manga/${mangaId}/votes${userWallet ? `?wallet=${userWallet}` : ''}`;
                console.log('🔍 Fetching votes from:', url);
                
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    console.log('📊 Vote data received:', data);
                    
                    // Verifica che i dati siano nel formato corretto
                    if (data && typeof data === 'object') {
                        currentVotes = {
                            upvotes: data.upvotes || 0,
                            downvotes: data.downvotes || 0,
                            userVote: data.userVote || null
                        };
                        updateVoteUI();
                    } else {
                        console.warn('⚠️ Invalid vote data format:', data);
                    }
                } else {
                    console.warn('⚠️ Vote endpoint returned:', res.status);
                    // Usa valori di default se l'endpoint non è disponibile
                    currentVotes = { upvotes: 0, downvotes: 0, userVote: null };
                    updateVoteUI();
                }
            } catch (err) {
                console.error('Error loading votes:', err);
                currentVotes = { upvotes: 0, downvotes: 0, userVote: null };
                updateVoteUI();
            }
        }

        async function handleVote(type) {
            if (!userWallet) {
                alert('Connect wallet to vote');
                return;
            }

            console.log('🗳️ Voting:', type, 'for manga:', mangaId);
            
            try {
                const res = await fetch(`${READER_API}/manga/${mangaId}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        voteType: type,
                        wallet: userWallet 
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    console.log('✅ Vote response:', data);
                    
                    // Aggiorna i voti correnti
                    currentVotes = {
                        upvotes: data.upvotes || 0,
                        downvotes: data.downvotes || 0,
                        userVote: data.userVote || null
                    };
                    
                    // Forza l'aggiornamento dell'UI
                    updateVoteUI();
                    
                    // Aggiungi effetto visivo
                    const button = document.getElementById(`vote-${type}`);
                    button.classList.add('animate-pulse');
                    setTimeout(() => button.classList.remove('animate-pulse'), 500);
                    
                } else {
                    const error = await res.text();
                    console.error('❌ Vote failed:', res.status, error);
                }
            } catch (err) {
                console.error('Vote error:', err);
            }
        }

        function updateVoteUI() {
            console.log('🔄 Updating vote UI with:', currentVotes);
            
            // Aggiorna contatori
            const upVotesEl = document.getElementById('up-votes');
            const downVotesEl = document.getElementById('down-votes');
            const voteScoreEl = document.getElementById('vote-score');
            const voteScoreDisplayEl = document.getElementById('vote-score-display');
            
            if (upVotesEl) upVotesEl.innerText = currentVotes.upvotes;
            if (downVotesEl) downVotesEl.innerText = currentVotes.downvotes;
            
            const score = currentVotes.upvotes - currentVotes.downvotes;
            if (voteScoreEl) voteScoreEl.innerText = score;
            if (voteScoreDisplayEl) voteScoreDisplayEl.innerText = score;
            
            // Aggiorna classi attive
            const upButton = document.getElementById('vote-up');
            const downButton = document.getElementById('vote-down');
            
            if (upButton && downButton) {
                upButton.classList.remove('active');
                downButton.classList.remove('active');
                
                if (currentVotes.userVote === 'up') {
                    upButton.classList.add('active');
                    console.log('👍 Up button activated');
                } else if (currentVotes.userVote === 'down') {
                    downButton.classList.add('active');
                    console.log('👎 Down button activated');
                }
            }
        }

        // ============================================
        // LOAD MANGA (CORRETTO)
        // ============================================
        async function loadManga() {
            if (!mangaId) {
                reader.innerHTML = `<div class="py-40 text-center text-orange-500 font-mono text-xs uppercase">⚠️ ID MANGA MANCANTE</div>`;
                return;
            }

            try {
                const res = await fetch(`${API_URL}/manga/${mangaId}`);
                if (!res.ok) throw new Error('Manga non trovato');
                
                const manga = await res.json();
                console.log('📦 Manga data:', manga);

                // Aggiorna header
                titleEl.innerText = manga.titolo || 'Senza titolo';
                
                // GESTIONE ROBUSTA DI CATEGORIE
                let categoriaText = 'UNSORTED';
                if (manga.categorie) {
                    if (typeof manga.categorie === 'string') {
                        categoriaText = manga.categorie;
                    } else if (typeof manga.categorie === 'object') {
                        categoriaText = manga.categorie.nome || manga.categorie.name || 'UNSORTED';
                    } else if (Array.isArray(manga.categorie) && manga.categorie.length > 0) {
                        const firstCat = manga.categorie[0];
                        categoriaText = firstCat.nome || firstCat.name || firstCat || 'UNSORTED';
                    }
                }
                catBadge.innerText = categoriaText.toUpperCase();
                
                // Aggiorna lingua
                langBadge.innerText = (manga.lingua || 'JP').toUpperCase();
                
                // Aggiorna pagine
                totalPagesEl.innerText = manga.numero_pagine || '0';
                totalPagesCount = manga.numero_pagine || 0;
                
                // GESTIONE ROBUSTA DI ARTISTA
                let artistaNome = null;
                if (manga.artista) {
                    artistaNome = typeof manga.artista === 'string' ? manga.artista : 
                                  manga.artista.nome || manga.artista.name || null;
                } else if (manga.artisti) {
                    if (Array.isArray(manga.artisti) && manga.artisti.length > 0) {
                        artistaNome = manga.artisti[0].nome || manga.artisti[0].name || null;
                    } else if (typeof manga.artisti === 'object') {
                        artistaNome = manga.artisti.nome || manga.artisti.name || null;
                    }
                }
                
                if (artistaNome) {
                    artistName.innerText = artistaNome;
                    artistCard.classList.remove('hidden');
                } else {
                    artistCard.classList.add('hidden');
                }
                
                // GESTIONE ROBUSTA DI TAGS
                let tags = [];
                if (manga.manga_tags && Array.isArray(manga.manga_tags)) {
                    tags = manga.manga_tags.map(t => {
                        if (t.tags && t.tags.nome) return t.tags.nome;
                        if (t.nome) return t.nome;
                        if (typeof t === 'string') return t;
                        return null;
                    }).filter(Boolean);
                } else if (manga.tags && Array.isArray(manga.tags)) {
                    tags = manga.tags.map(t => {
                        if (t.nome) return t.nome;
                        if (typeof t === 'string') return t;
                        return null;
                    }).filter(Boolean);
                }
                
                if (tags.length > 0) {
                    tagCount.innerText = tags.length;
                    dropdownTagCount.innerText = tags.length;
                    tagsList.innerHTML = tags.map(t => 
                        `<span class="tag-pill">${t}</span>`
                    ).join('');
                } else {
                    tagCount.innerText = '0';
                    dropdownTagCount.innerText = '0';
                    tagsList.innerHTML = '<span class="text-gray-600 text-xs">Nessun tag</span>';
                }

                // GESTIONE ROBUSTA DI PAGINE
                let pages = manga.pagine || manga.pages || [];
                if (typeof pages === 'string') {
                    try {
                        pages = JSON.parse(pages);
                    } catch {
                        pages = [];
                    }
                }
                
                if (!Array.isArray(pages)) {
                    pages = [];
                }

                // Inizia sessione di lettura se wallet connesso
                if (userWallet) {
                    await startReadingSession();
                }

                // Inizia caricamento pagine
                renderPages(pages, manga.numero_pagine || pages.length);

            } catch (err) {
                console.error('❌ Load error:', err);
                reader.innerHTML = `<div class="py-40 text-center text-red-500 font-mono text-xs uppercase">❌ ${err.message}</div>`;
            }
        }

        // Render pagine
        function renderPages(pages, total) {
            reader.innerHTML = '';
            
            if (!pages?.length) {
                reader.innerHTML = `<div class="py-40 text-center text-gray-500 font-mono text-xs uppercase">📭 Nessuna pagina trovata</div>`;
                return;
            }

            pages.forEach((url, index) => {
                const pageNum = index + 1;
                
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page-node w-full';
                pageDiv.dataset.page = pageNum;
                
                const img = document.createElement('img');
                img.className = 'manga-image opacity-0 transition-opacity duration-500';
                img.src = `${PROXY_URL}${encodeURIComponent(url)}`;
                img.alt = `Pagina ${pageNum}`;
                img.loading = 'lazy';
                
                img.onload = () => {
                    img.classList.replace('opacity-0', 'opacity-100');
                };
                
                img.onerror = () => {
                    img.src = `https://placehold.co/800x1200/0a0a0a/f6851b?text=PAGINA+${pageNum}`;
                    img.classList.replace('opacity-0', 'opacity-100');
                };
                
                pageDiv.appendChild(img);
                reader.appendChild(pageDiv);
            });

            // Aggiorna contatore prima pagina
            updatePageCounters(1, total);
            setupObserver(total);
            
            // DOPO aver renderizzato le pagine, carica i voti e bookmark
            setTimeout(() => {
                loadVoteStatus();
                if (userWallet) {
                    loadBookmark();
                }
            }, 500);
        }

        // Observer per aggiornare contatore durante scroll
        function setupObserver(total) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const page = entry.target.dataset.page;
                        updatePageCounters(parseInt(page), total);
                    }
                });
            }, { threshold: 0.2, rootMargin: '-100px 0px' });

            document.querySelectorAll('.page-node').forEach(node => observer.observe(node));
        }

        // ============================================
        // COMMENTS SYSTEM
        // ============================================
        let commentsState = {
            page: 1,
            total: 0,
            hasMore: false,
            mentionSuggestions: [],
            mentionPosition: null,
            mentionQuery: '',
            currentMentionIndex: -1,
            isLoading: false
        };

        // Carica commenti (MODIFICATO con loading indicator)
        async function loadComments(page = 1) {
            if (!mangaId) return;
            
            const loadingEl = document.getElementById('comments-loading');
            const commentsList = document.getElementById('comments-list');
            
            if (!commentsList) return;
            
            // Mostra loading indicator
            if (loadingEl) loadingEl.classList.remove('hidden');
            commentsState.isLoading = true;

            try {
                const url = `${COMMENTS_API}/manga/${mangaId}?page=${page}&limit=20${userWallet ? `&wallet=${userWallet}` : ''}`;
                const res = await fetch(url);
                
                if (res.ok) {
                    const data = await res.json();
                    renderComments(data.comments, page === 1);
                    
                    commentsState.total = data.total;
                    commentsState.hasMore = data.comments && data.comments.length === 20;
                    commentsState.page = page;
                    
                    const loadMoreBtn = document.getElementById('load-more-comments');
                    if (loadMoreBtn) {
                        if (commentsState.hasMore) {
                            loadMoreBtn.classList.remove('hidden');
                        } else {
                            loadMoreBtn.classList.add('hidden');
                        }
                    }
                }
            } catch (err) {
                console.error('Error loading comments:', err);
                if (page === 1) {
                    commentsList.innerHTML = `
                        <div class="text-center py-12 text-gray-600">
                            <i class="fas fa-exclamation-triangle text-4xl mb-4 opacity-30"></i>
                            <p class="text-sm">Error loading comments. Please try again.</p>
                        </div>
                    `;
                }
            } finally {
                // Nascondi loading indicator
                if (loadingEl) loadingEl.classList.add('hidden');
                commentsState.isLoading = false;
            }
        }

        // Renderizza commenti
        function renderComments(comments, replace = true) {
            const container = document.getElementById('comments-list');
            if (!container) return;
            
            if (!comments || comments.length === 0) {
                if (replace) {
                    container.innerHTML = `
                        <div class="text-center py-12 text-gray-600">
                            <i class="fas fa-comment-dots text-4xl mb-4 opacity-30"></i>
                            <p class="text-sm">No comments yet. Be the first to share your thoughts!</p>
                        </div>
                    `;
                }
                return;
            }

            const commentsHtml = comments.map(comment => renderComment(comment)).join('');
            
            if (replace) {
                container.innerHTML = commentsHtml;
            } else {
                container.innerHTML += commentsHtml;
            }
        }

        // Renderizza singolo commento
        function renderComment(comment) {
            const timeAgo = getTimeAgo(new Date(comment.created_at));
            const userVote = comment.user_vote;
            const score = (comment.up_votes || 0) - (comment.down_votes || 0);
            const isAuthor = userWallet && userWallet === comment.user_wallet;
            
            // Processa menzioni nel testo
            let content = comment.content;
            if (comment.mentioned_manga && comment.mentioned_manga.length) {
                comment.mentioned_manga.forEach(manga => {
                    const regex = new RegExp(`@${manga.mangaId}`, 'g');
                    content = content.replace(regex, `<a href="/reader.html?id=${manga.mangaId}" class="text-orange-500 hover:underline font-bold">@${manga.mangaTitle}</a>`);
                });
            }

            return `
                <div class="comment bg-zinc-900/30 border border-zinc-800 rounded-2xl p-6" data-comment-id="${comment.id}">
                    <div class="flex gap-4">
                        <div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-user text-gray-600"></i>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="font-mono text-xs text-orange-500">${shortenWallet(comment.user_wallet)}</span>
                                <span class="text-[10px] text-gray-600">•</span>
                                <span class="text-[10px] text-gray-600">${timeAgo}</span>
                                ${comment.is_edited ? '<span class="text-[8px] text-gray-700 italic">(edited)</span>' : ''}
                            </div>
                            
                            <div class="text-sm text-gray-300 mb-4 prose prose-invert max-w-none">
                                ${content}
                            </div>
                            
                            <div class="flex items-center gap-4">
                                <!-- Vote buttons -->
                                <div class="flex items-center gap-2">
                                    <button onclick="voteComment(${comment.id}, 'up')" 
                                            class="text-xs ${userVote === 'up' ? 'text-green-500' : 'text-gray-600 hover:text-green-500'} transition">
                                        <i class="fas fa-arrow-up"></i>
                                    </button>
                                    <span class="text-xs font-mono ${score > 0 ? 'text-green-500' : score < 0 ? 'text-red-500' : 'text-gray-500'}">${score}</span>
                                    <button onclick="voteComment(${comment.id}, 'down')" 
                                            class="text-xs ${userVote === 'down' ? 'text-red-500' : 'text-gray-600 hover:text-red-500'} transition">
                                        <i class="fas fa-arrow-down"></i>
                                    </button>
                                </div>
                                
                                <!-- Reply button -->
                                <button onclick="showReplyForm(${comment.id})" class="text-xs text-gray-600 hover:text-orange-500 transition">
                                    <i class="fas fa-reply mr-1"></i> Reply
                                </button>
                                
                                <!-- Reply count -->
                                ${comment.reply_count > 0 ? `
                                    <button onclick="toggleReplies(${comment.id})" class="text-xs text-gray-600 hover:text-orange-500 transition">
                                        <i class="fas fa-chevron-down mr-1"></i> ${comment.reply_count} ${comment.reply_count === 1 ? 'reply' : 'replies'}
                                    </button>
                                ` : ''}
                                
                                <!-- Edit/Delete for author -->
                                ${isAuthor ? `
                                    <button onclick="editComment(${comment.id})" class="text-xs text-gray-600 hover:text-blue-500 transition ml-auto">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button onclick="deleteComment(${comment.id})" class="text-xs text-gray-600 hover:text-red-500 transition">
                                        <i class="fas fa-trash"></i>

        }

        // Gestione input per menzioni
        function handleCommentInput(event) {
            const textarea = event.target;
            const cursorPos = textarea.selectionStart;
            const text = textarea.value;
            
            // Cerca @ prima del cursore
            const textBeforeCursor = text.substring(0, cursorPos);
            const atIndex = textBeforeCursor.lastIndexOf('@');
            
            if (atIndex !== -1 && (atIndex === 0 || textBeforeCursor[atIndex - 1] === ' ')) {
                const query = textBeforeCursor.substring(atIndex + 1);
                if (query.length >= 1) {
                    showMentionSuggestions(query, textarea, atIndex);
                    return;
                }
            }
            
            hideMentionSuggestions();
        }

        // Mostra suggerimenti menzioni
        async function showMentionSuggestions(query, textarea, atIndex) {
            try {
                const res = await fetch(`${COMMENTS_API}/search-manga?q=${encodeURIComponent(query)}&limit=5`);
                const suggestions = await res.json();
                
                if (suggestions.length === 0) {
                    hideMentionSuggestions();
                    return;
                }
                
                const rect = textarea.getBoundingClientRect();
                const suggestionsEl = document.getElementById('mention-suggestions');
                if (!suggestionsEl) return;
                
                suggestionsEl.innerHTML = suggestions.map((manga, index) => `
                    <div class="mention-item p-2 hover:bg-zinc-800 cursor-pointer flex items-center gap-2 ${index === commentsState.currentMentionIndex ? 'bg-zinc-800' : ''}"
                         onclick="insertMention(${manga.id}, '${manga.titolo.replace(/'/g, "\\'")}', ${atIndex})">
                        <img src="${PROXY_URL}${encodeURIComponent(manga.immagine || '')}" class="w-6 h-8 object-cover rounded">
                        <span class="text-sm truncate">${manga.titolo}</span>
                    </div>
                `).join('');
                
                suggestionsEl.style.top = rect.bottom + window.scrollY + 5 + 'px';
                suggestionsEl.style.left = rect.left + window.scrollX + 'px';
                suggestionsEl.classList.remove('hidden');
                
                commentsState.mentionSuggestions = suggestions;
                commentsState.mentionPosition = atIndex;
            } catch (err) {
                console.error('Error fetching suggestions:', err);
            }
        }

        // Inserisci menzione
        function insertMention(mangaId, mangaTitle, atIndex) {
            const textarea = document.getElementById('comment-input');
            if (!textarea) return;
            
            const text = textarea.value;
            
            // Sostituisci dalla @ fino al cursore
            const textBeforeAt = text.substring(0, atIndex);
            const textAfterCursor = text.substring(textarea.selectionStart);
            
            textarea.value = `${textBeforeAt}@${mangaId} ${textAfterCursor}`;
            hideMentionSuggestions();
            
            // Aggiorna array delle menzioni nel commento
            if (!window.mentionedMangaIds) window.mentionedMangaIds = [];
            window.mentionedMangaIds.push(mangaId);
            
            textarea.focus();
        }

        // Nascondi suggerimenti
        function hideMentionSuggestions() {
            const suggestionsEl = document.getElementById('mention-suggestions');
            if (suggestionsEl) {
                suggestionsEl.classList.add('hidden');
            }
            commentsState.currentMentionIndex = -1;
        }

        // Invia commento
        async function submitComment() {
            if (!userWallet) {
                alert('Connect wallet to comment');
                return;
            }
            
            const textarea = document.getElementById('comment-input');
            if (!textarea) return;
            
            const content = textarea.value.trim();
            
            if (!content) {
                alert('Comment cannot be empty');
                return;
            }
            
            // Estrai ID manga menzionati
            const mentionRegex = /@(\d+)/g;
            const matches = [...content.matchAll(mentionRegex)];
            const mentionedMangaIds = matches.map(m => parseInt(m[1]));
            
            try {
                const res = await fetch(`${COMMENTS_API}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-wallet': userWallet
                    },
                    body: JSON.stringify({
                        mangaId: parseInt(mangaId),
                        content: content,
                        mentionedMangaIds: mentionedMangaIds
                    })
                });
                
                if (res.ok) {
                    textarea.value = '';
                    window.mentionedMangaIds = [];
                    await loadComments(1); // Ricarica commenti
                } else {
                    const error = await res.json();
                    alert('Error posting comment: ' + (error.message || 'Unknown error'));
                }
            } catch (err) {
                console.error('Error posting comment:', err);
                alert('Failed to post comment');
            }
        }

        // Vota commento
        async function voteComment(commentId, voteType) {
            if (!userWallet) {
                alert('Connect wallet to vote');
                return;
            }
            
            try {
                const res = await fetch(`${COMMENTS_API}/${commentId}/vote`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-wallet': userWallet
                    },
                    body: JSON.stringify({ voteType })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    // Aggiorna UI locale
                    location.reload(); // Ricarica per semplicità
                }
            } catch (err) {
                console.error('Error voting comment:', err);
            }
        }

        // Funzioni helper per commenti
        function showReplyForm(commentId) {
            alert('Reply functionality coming soon');
        }

        function toggleReplies(commentId) {
            const repliesContainer = document.getElementById(`replies-${commentId}`);
            if (repliesContainer) {
                if (repliesContainer.classList.contains('hidden')) {
                    repliesContainer.classList.remove('hidden');
                    // Carica risposte
                } else {
                    repliesContainer.classList.add('hidden');
                }
            }
        }

        function editComment(commentId) {
            alert('Edit functionality coming soon');
        }

        function deleteComment(commentId) {
            alert('Delete functionality coming soon');
        }

        // Helper: abbrevia wallet
        function shortenWallet(wallet) {
            if (!wallet) return 'Anonymous';
            return wallet.substring(0, 6) + '...' + wallet.slice(-4);
        }

        // Helper: time ago
        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            const intervals = {
                year: 31536000,
                month: 2592000,
                week: 604800,
                day: 86400,
                hour: 3600,
                minute: 60
            };
            
            for (const [unit, secondsInUnit] of Object.entries(intervals)) {
                const interval = Math.floor(seconds / secondsInUnit);
                if (interval >= 1) {
                    return interval + ' ' + unit + (interval === 1 ? '' : 's') + ' ago';
                }
            }
            return 'just now';
        }

        // Carica più commenti
        function loadMoreComments() {
            loadComments(commentsState.page + 1);
        }

        // ============================================
        // INITIALIZATION (MODIFICATO)
        // ============================================
        window.addEventListener('load', () => {
            checkBackendConnection(); // NOVITÀ: verifica connessione
            loadManga();
            if (mangaId) {
                setTimeout(() => loadComments(1), 1000);
            }
        });

        // Esponi funzioni globali
        window.connectWallet = connectWallet;
        window.handleVote = handleVote;
        window.handleCommentInput = handleCommentInput;
        window.submitComment = submitComment;
        window.voteComment = voteComment;
        window.loadMoreComments = loadMoreComments;
        window.showReplyForm = showReplyForm;
        window.toggleReplies = toggleReplies;
        window.editComment = editComment;
        window.deleteComment = deleteComment;
        window.insertMention = insertMention;
    </script>
