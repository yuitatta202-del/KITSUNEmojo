<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Kitsune Mojo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    body {
      background: #050505;
      color: #e2e8f0;
    }
    .profile-card {
      background: #0a0a0a;
      border: 1px solid #1f2937;
      border-radius: 1.5rem;
    }
    .stat-box {
      background: #0a0a0a;
      border: 1px solid #1f2937;
      border-radius: 1rem;
      padding: 1.5rem;
      text-align: center;
    }
  </style>
</head>
<body class="font-sans">
  <!-- Navbar (copia da index.html) -->
  <nav class="glass-nav sticky top-0 z-50 px-6 py-4">
    <!-- ... stesso navbar di index.html ... -->
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-10">
    <div class="profile-card p-8 mb-8">
      <div class="flex items-center gap-6">
        <img id="profile-avatar" src="" alt="avatar" class="w-24 h-24 rounded-full border-4 border-orange-500">
        <div>
          <h1 id="profile-name" class="text-3xl font-bold">Loading...</h1>
          <p id="profile-email" class="text-gray-500">Loading...</p>
          <p class="text-sm text-gray-600 mt-2">Member since <span id="member-since"></span></p>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="stat-box">
        <i class="fas fa-book-open text-2xl text-orange-500 mb-2"></i>
        <div class="text-2xl font-bold" id="reading-count">0</div>
        <div class="text-gray-500 text-sm">Reading</div>
      </div>
      <div class="stat-box">
        <i class="fas fa-heart text-2xl text-red-500 mb-2"></i>
        <div class="text-2xl font-bold" id="favorites-count">0</div>
        <div class="text-gray-500 text-sm">Favorites</div>
      </div>
      <div class="stat-box">
        <i class="fas fa-clock text-2xl text-green-500 mb-2"></i>
        <div class="text-2xl font-bold" id="completed-count">0</div>
        <div class="text-gray-500 text-sm">Completed</div>
      </div>
    </div>

    <div class="border-t border-gray-900 pt-8">
      <h2 class="text-xl font-bold mb-4">Reading History</h2>
      <div id="history-list" class="space-y-4">
        <!-- Popolato via JS -->
      </div>
    </div>
  </main>

  <script>
    const BASE_URL = window.location.hostname === 'localhost' 
      ? 'http://localhost:3000' 
      : 'https://kitsune-backend.onrender.com';

    const AUTH_API = `${BASE_URL}/api/auth`;
    const USER_API = `${BASE_URL}/users`;
    const BOOKMARK_API = `${BASE_URL}/bookmarks`;
    const FAVORITE_API = `${BASE_URL}/favorites`;
    const HISTORY_API = `${BASE_URL}/history`;

    async function loadProfile() {
      const token = localStorage.getItem('authToken');
      if (!token) {
        window.location.href = '/';
        return;
      }

      try {
        // Carica info utente
        const userRes = await fetch(`${AUTH_API}/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const user = await userRes.json();

        document.getElementById('profile-name').textContent = user.name || 'User';
        document.getElementById('profile-email').textContent = user.email;
        document.getElementById('profile-avatar').src = user.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'User')}&background=f6851b&color=fff&size=128`;
        document.getElementById('member-since').textContent = new Date(user.created_at).toLocaleDateString();

        // Carica statistiche
        const [bookmarks, favorites, history] = await Promise.all([
          fetch(`${BOOKMARK_API}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()),
          fetch(`${FAVORITE_API}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()),
          fetch(`${HISTORY_API}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json())
        ]);

        document.getElementById('reading-count').textContent = bookmarks.filter(b => b.status === 'reading').length;
        document.getElementById('favorites-count').textContent = favorites.length;
        document.getElementById('completed-count').textContent = bookmarks.filter(b => b.status === 'completed').length;

        // Mostra cronologia
        const historyList = document.getElementById('history-list');
        if (history.length === 0) {
          historyList.innerHTML = '<p class="text-gray-600 text-center py-8">No reading history yet</p>';
        } else {
          historyList.innerHTML = history.map(h => `
            <div class="flex items-center justify-between bg-gray-900/50 p-4 rounded-lg">
              <div class="flex items-center gap-4">
                <img src="${h.manga?.immagine ? BASE_URL + '/admin/proxy?url=' + encodeURIComponent(h.manga.immagine) : 'https://placehold.co/50x70/0a0a0a/f6851b?text=NO'}" class="w-12 h-16 object-cover rounded">
                <div>
                  <a href="/reader.html?id=${h.manga_id}" class="font-bold hover:text-orange-500">${h.manga?.titolo || 'Unknown'}</a>
                  <p class="text-xs text-gray-500">Last read: ${new Date(h.last_read).toLocaleString()}</p>
                </div>
              </div>
              <span class="text-sm text-orange-500">Page ${h.page}</span>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Failed to load profile:', error);
      }
    }

    loadProfile();
  </script>
</body>
</html>
