<!doctype html>
<html lang="it">
<head>
         <!-- Meta tag exoclick -->
    <meta name="6a97888e-site-verification" content="86cedfa6aeb1cfa2ee94bb96f9934555">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitsune Mojo | Commenti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        body {
            background-color: #050505;
            color: #e2e8f0;
        }
        .glass-nav {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1f2937;
        }
        .comment-card {
            background: #0a0a0a;
            border: 1px solid #1f2937;
            border-radius: 1rem;
            transition: all 0.3s ease;
        }
        .comment-card:hover {
            border-color: #f6851b;
        }
        .mention-badge {
            background: rgba(246, 133, 27, 0.1);
            border: 1px solid rgba(246, 133, 27, 0.2);
            color: #f6851b;
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.6rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            text-decoration: none;
            transition: all 0.2s;
        }
        .mention-badge:hover {
            background: #f6851b;
            color: #000;
        }
        .reply-thread {
            border-left: 2px solid #1f2937;
            margin-left: 2rem;
            padding-left: 1rem;
        }
        .vote-button {
            background: #111;
            border: 1px solid #1f2937;
            border-radius: 9999px;
            padding: 0.25rem 0.75rem;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .vote-button:hover {
            border-color: #f6851b;
        }
        .vote-button.active.up {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }
        .vote-button.active.down {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }
        .mention-suggestion {
            position: absolute;
            background: #111;
            border: 1px solid #1f2937;
            border-radius: 1rem;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .mention-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid #1f2937;
        }
        .mention-item:last-child {
            border-bottom: none;
        }
        .mention-item:hover {
            background: #f6851b;
            color: #000;
        }
        .wallet-badge {
            background: #0a0a0a;
            border: 1px solid #f6851b;
            border-radius: 30px;
            padding: 0.25rem 0.75rem;
            font-size: 0.6rem;
            font-weight: 700;
            color: #f6851b;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #f6851b;
            border-radius: 10px;
        }
    </style>
</head>
<body class="font-sans">
    <nav class="glass-nav sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <i class="fas fa-fox text-orange-500 text-2xl"></i>
                <span class="text-xl font-black tracking-tighter uppercase">Kitsune<span class="text-orange-500">Mojo</span></span>
            </div>
            <div class="flex items-center gap-4">
                <div id="wallet-container" class="wallet-badge hidden">
                    <i class="fas fa-wallet text-[8px]"></i>
                    <span id="wallet-address">Not Connected</span>
                </div>
                <button id="connect-wallet-btn" onclick="connectWallet()" class="text-xs bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded-full font-bold transition">
                    Connect
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <h1 class="text-3xl font-black mb-2">📝 Discussioni <span class="text-orange-500">Community</span></h1>
        <p class="text-gray-500 text-sm mb-8">Usa @ seguito da un ID manga (es. @123) per menzionare un titolo</p>

        <!-- Filtri -->
        <div class="flex gap-4 mb-8">
            <input type="text" id="manga-filter" placeholder="Filtra per ID manga..." 
                   class="bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2 text-sm flex-1 focus:outline-none focus:border-orange-500">
            <button onclick="loadComments()" class="bg-orange-600 px-6 py-2 rounded-xl text-sm font-bold hover:bg-orange-500 transition">
                <i class="fas fa-search mr-2"></i>Cerca
            </button>
        </div>

        <!-- Form nuovo commento -->
        <div class="comment-card p-6 mb-8">
            <textarea id="comment-content" rows="3" 
                      class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-4 text-sm mb-4 focus:outline-none focus:border-orange-500"
                      placeholder="Scrivi un commento... Usa @ID per menzionare un manga (es. @58)"></textarea>
            <div class="flex justify-end">
                <button onclick="postComment()" class="bg-orange-600 px-6 py-2 rounded-xl text-sm font-bold hover:bg-orange-500 transition">
                    <i class="fas fa-paper-plane mr-2"></i>Pubblica
                </button>
            </div>
        </div>

        <!-- Lista commenti -->
        <div id="comments-container" class="space-y-6">
            <div class="text-center py-12 text-gray-600">
                <i class="fas fa-comments text-4xl mb-4 opacity-30"></i>
                <p>Inserisci un ID manga per vedere i commenti</p>
            </div>
        </div>

        <!-- Load More -->
        <div id="load-more" class="text-center mt-8 hidden">
            <button onclick="loadMoreComments()" class="bg-zinc-900 border border-zinc-800 px-8 py-3 rounded-xl text-sm font-bold hover:border-orange-500 transition">
                Carica altri commenti
            </button>
        </div>
    </main>

    <script>
        // ============================================
        // CONFIGURAZIONE
        // ============================================
        const BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000' 
            : 'https://kitsune-backend.onrender.com';

        const COMMENTS_API = `${BASE_URL}/comments`;
        const MANGA_API = `${BASE_URL}/admin/manga`;

        let userWallet = null;
        let currentPage = 1;
        let currentMangaId = null;
        let hasMore = false;
        let allManga = [];

        // ============================================
        // WALLET CONNECTION
        // ============================================
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userWallet = accounts[0].toLowerCase();
                    
                    document.getElementById('connect-wallet-btn').classList.add('hidden');
                    document.getElementById('wallet-container').classList.remove('hidden');
                    document.getElementById('wallet-address').innerText = 
                        userWallet.substring(0, 6) + '...' + userWallet.slice(-4);
                    
                    console.log('✅ Wallet connected:', userWallet);
                } catch (err) {
                    console.error('Wallet connection failed:', err);
                }
            } else {
                alert('Please install MetaMask');
            }
        }

        // ============================================
        // CARICA MANGA PER SUGGERIMENTI
        // ============================================
        async function loadMangaForMentions() {
            try {
                const res = await fetch(MANGA_API);
                if (res.ok) {
                    allManga = await res.json();
                    console.log(`📚 Loaded ${allManga.length} manga for mentions`);
                }
            } catch (err) {
                console.error('Error loading manga:', err);
            }
        }

        // ============================================
        // SUGGERIMENTI @MENTION
        // ============================================
        function setupMentionAutocomplete() {
            const textarea = document.getElementById('comment-content');
            const suggestionsDiv = document.createElement('div');
            suggestionsDiv.className = 'mention-suggestion hidden';
            textarea.parentNode.appendChild(suggestionsDiv);

            textarea.addEventListener('input', (e) => {
                const cursorPos = e.target.selectionStart;
                const text = e.target.value;
                const lastAtIndex = text.lastIndexOf('@', cursorPos - 1);
                
                if (lastAtIndex !== -1 && lastAtIndex < cursorPos) {
                    const searchTerm = text.substring(lastAtIndex + 1, cursorPos).toLowerCase();
                    
                    if (searchTerm.length > 0) {
                        const matches = allManga.filter(m => 
                            m.id.toString().includes(searchTerm) || 
                            (m.titolo && m.titolo.toLowerCase().includes(searchTerm))
                        ).slice(0, 5);

                        if (matches.length > 0) {
                            const rect = textarea.getBoundingClientRect();
                            suggestionsDiv.style.top = (rect.bottom + window.scrollY) + 'px';
                            suggestionsDiv.style.left = rect.left + 'px';
                            suggestionsDiv.style.width = rect.width + 'px';
                            suggestionsDiv.classList.remove('hidden');
                            
                            suggestionsDiv.innerHTML = matches.map(m => `
                                <div class="mention-item" onclick="insertMention(${m.id}, '${m.titolo.replace(/'/g, "\\'")}')">
                                    <span class="font-bold">@${m.id}</span> - ${m.titolo.substring(0, 50)}
                                </div>
                            `).join('');
                            return;
                        }
                    }
                }
                suggestionsDiv.classList.add('hidden');
            });

            textarea.addEventListener('blur', () => {
                setTimeout(() => suggestionsDiv.classList.add('hidden'), 200);
            });
        }

        window.insertMention = function(mangaId, mangaTitle) {
            const textarea = document.getElementById('comment-content');
            const cursorPos = textarea.selectionStart;
            const text = textarea.value;
            const lastAtIndex = text.lastIndexOf('@', cursorPos - 1);
            
            if (lastAtIndex !== -1) {
                const newText = text.substring(0, lastAtIndex) + `@${mangaId} ` + text.substring(cursorPos);
                textarea.value = newText;
            }
            
            document.querySelector('.mention-suggestion')?.classList.add('hidden');
            textarea.focus();
        };

        // ============================================
        // POST COMMENTO
        // ============================================
        async function postComment() {
            if (!userWallet) {
                alert('Connect wallet first');
                return;
            }

            const content = document.getElementById('comment-content').value.trim();
            if (!content) return;

            const mangaFilter = document.getElementById('manga-filter').value;
            const mangaId = mangaFilter ? parseInt(mangaFilter) : null;

            if (!mangaId) {
                alert('Inserisci un ID manga per commentare');
                return;
            }

            try {
                const res = await fetch(`${COMMENTS_API}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-wallet': userWallet
                    },
                    body: JSON.stringify({
                        manga_id: mangaId,
                        content: content
                    })
                });

                if (res.ok) {
                    document.getElementById('comment-content').value = '';
                    currentPage = 1;
                    await loadComments();
                } else {
                    const error = await res.json();
                    alert('Error: ' + (error.message || 'Failed to post comment'));
                }
            } catch (err) {
                console.error('Error posting comment:', err);
                alert('Failed to post comment');
            }
        }

        // ============================================
        // CARICA COMMENTI
        // ============================================
        async function loadComments() {
            const mangaFilter = document.getElementById('manga-filter').value;
            const mangaId = mangaFilter ? parseInt(mangaFilter) : null;

            if (!mangaId) {
                alert('Inserisci un ID manga per vedere i commenti');
                return;
            }

            currentMangaId = mangaId;
            currentPage = 1;

            try {
                const url = `${COMMENTS_API}/manga/${mangaId}?page=${currentPage}&limit=10${userWallet ? `&wallet=${userWallet}` : ''}`;
                console.log('🔍 Fetching comments from:', url);
                
                const res = await fetch(url);
                
                if (res.ok) {
                    const data = await res.json();
                    renderComments(data.comments);
                    
                    hasMore = data.hasMore || false;
                    document.getElementById('load-more').classList.toggle('hidden', !hasMore);
                } else {
                    console.error('Failed to load comments:', res.status);
                }
            } catch (err) {
                console.error('Error loading comments:', err);
            }
        }

        // ============================================
        // CARICA RISPOSTE
        // ============================================
        async function loadReplies(commentId, containerId) {
            try {
                const url = `${COMMENTS_API}/${commentId}/replies${userWallet ? `?wallet=${userWallet}` : ''}`;
                const res = await fetch(url);
                
                if (res.ok) {
                    const replies = await res.json();
                    renderReplies(replies, containerId);
                }
            } catch (err) {
                console.error('Error loading replies:', err);
            }
        }

        // ============================================
        // VOTA COMMENTO
        // ============================================
        async function voteComment(commentId, voteType) {
            if (!userWallet) {
                alert('Connect wallet first');
                return;
            }

            try {
                const res = await fetch(`${COMMENTS_API}/${commentId}/vote`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-wallet': userWallet
                    },
                    body: JSON.stringify({
                        voteType: voteType
                    })
                });

                if (res.ok) {
                    const result = await res.json();
                    updateCommentVotes(commentId, result);
                } else {
                    console.error('Vote failed:', res.status);
                }
            } catch (err) {
                console.error('Error voting:', err);
            }
        }

        // ============================================
        // AGGIORNA VOTI NEL DOM
        // ============================================
        function updateCommentVotes(commentId, voteData) {
            const commentElement = document.getElementById(`comment-${commentId}`);
            if (!commentElement) return;

            const upButton = commentElement.querySelector('[onclick*="voteComment(' + commentId + ', \'up\')"]');
            const downButton = commentElement.querySelector('[onclick*="voteComment(' + commentId + ', \'down\')"]');
            const scoreElement = commentElement.querySelector('.vote-score');

            if (upButton) {
                upButton.classList.remove('active', 'up');
                upButton.innerHTML = `<i class="fas fa-arrow-up"></i> ${voteData.up_votes || 0}`;
            }
            
            if (downButton) {
                downButton.classList.remove('active', 'down');
                downButton.innerHTML = `<i class="fas fa-arrow-down"></i> ${voteData.down_votes || 0}`;
            }

            if (voteData.user_vote === 'up' && upButton) {
                upButton.classList.add('active', 'up');
            } else if (voteData.user_vote === 'down' && downButton) {
                downButton.classList.add('active', 'down');
            }

            if (scoreElement) {
                const score = (voteData.up_votes || 0) - (voteData.down_votes || 0);
                scoreElement.textContent = score > 0 ? '+' + score : score.toString();
            }
        }

        // ============================================
        // MOSTRA FORM RISPOSTA
        // ============================================
        function showReplyForm(commentId) {
            const commentElement = document.getElementById(`comment-${commentId}`);
            if (!commentElement) return;

            const existingForm = commentElement.querySelector('.reply-form');
            if (existingForm) {
                existingForm.remove();
                return;
            }

            const replyForm = document.createElement('div');
            replyForm.className = 'reply-form mt-4';
            replyForm.innerHTML = `
                <textarea class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-sm mb-2 focus:outline-none focus:border-orange-500" 
                          rows="2" placeholder="Scrivi una risposta..."></textarea>
                <div class="flex justify-end gap-2">
                    <button onclick="cancelReply(${commentId})" class="text-xs px-3 py-1 bg-zinc-900 rounded-lg hover:bg-zinc-800 transition">Annulla</button>
                    <button onclick="submitReply(${commentId})" class="text-xs px-3 py-1 bg-orange-600 rounded-lg hover:bg-orange-500 transition">Rispondi</button>
                </div>
            `;

            commentElement.appendChild(replyForm);
        }

        function cancelReply(commentId) {
            const commentElement = document.getElementById(`comment-${commentId}`);
            const replyForm = commentElement?.querySelector('.reply-form');
            if (replyForm) replyForm.remove();
        }

        async function submitReply(commentId) {
            if (!userWallet) {
                alert('Connect wallet first');
                return;
            }

            const commentElement = document.getElementById(`comment-${commentId}`);
            const replyTextarea = commentElement?.querySelector('.reply-form textarea');
            
            if (!replyTextarea || !replyTextarea.value.trim()) return;

            const mangaId = currentMangaId;

            try {
                const res = await fetch(`${COMMENTS_API}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-wallet': userWallet
                    },
                    body: JSON.stringify({
                        manga_id: mangaId,
                        content: replyTextarea.value.trim(),
                        parent_id: commentId
                    })
                });

                if (res.ok) {
                    const repliesContainerId = `replies-${commentId}`;
                    await loadReplies(commentId, repliesContainerId);
                    
                    // Mostra il container delle risposte
                    const repliesContainer = document.getElementById(repliesContainerId);
                    if (repliesContainer) {
                        repliesContainer.classList.remove('hidden');
                    }
                    
                    cancelReply(commentId);
                } else {
                    const error = await res.json();
                    alert('Error: ' + (error.message || 'Failed to post reply'));
                }
            } catch (err) {
                console.error('Error posting reply:', err);
                alert('Failed to post reply');
            }
        }

        // ============================================
        // RENDERING
        // ============================================
        function renderComments(comments) {
            const container = document.getElementById('comments-container');
            
            if (!comments || comments.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-600">
                        <i class="fas fa-comments text-4xl mb-4 opacity-30"></i>
                        <p>Nessun commento trovato per questo manga</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            comments.forEach(comment => {
                const commentEl = createCommentElement(comment);
                container.appendChild(commentEl);
            });
        }

        function renderReplies(replies, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.innerHTML = '';
            
            if (!replies || replies.length === 0) return;
            
            replies.forEach(reply => {
                const replyEl = createCommentElement(reply, true);
                container.appendChild(replyEl);
            });
        }

        function createCommentElement(comment, isReply = false) {
            const div = document.createElement('div');
            div.className = `comment-card p-6 ${isReply ? 'mt-4' : ''}`;
            div.id = `comment-${comment.id}`;

            const score = (comment.up_votes || 0) - (comment.down_votes || 0);
            const userVoteClass = comment.user_vote === 'up' ? 'active up' : comment.user_vote === 'down' ? 'active down' : '';

            // Crea HTML per le menzioni
            const mentionsHtml = comment.mentions?.map(m => `
                <a href="/reader.html?id=${m.mangaId}" class="mention-badge">
                    <i class="fas fa-link"></i> @${m.mangaId} ${m.mangaTitle ? m.mangaTitle.substring(0, 20) + '...' : ''}
                </a>
            `).join(' ') || '';

            const repliesContainerId = `replies-${comment.id}`;

            div.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-user-circle text-2xl text-orange-500/50"></i>
                        <span class="font-mono text-sm">${comment.user_wallet ? comment.user_wallet.substring(0, 6) + '...' + comment.user_wallet.slice(-4) : 'Anonymous'}</span>
                        <span class="text-gray-600 text-xs">${new Date(comment.created_at).toLocaleString()}</span>
                        ${comment.is_edited ? '<span class="text-gray-600 text-xs">(modificato)</span>' : ''}
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="voteComment(${comment.id}, 'up')" class="vote-button ${userVoteClass.includes('up') ? 'active up' : ''}">
                            <i class="fas fa-arrow-up"></i> ${comment.up_votes || 0}
                        </button>
                        <button onclick="voteComment(${comment.id}, 'down')" class="vote-button ${userVoteClass.includes('down') ? 'active down' : ''}">
                            <i class="fas fa-arrow-down"></i> ${comment.down_votes || 0}
                        </button>
                        <span class="vote-score text-orange-500 font-bold text-sm ml-2">${score > 0 ? '+' : ''}${score}</span>
                    </div>
                </div>
                <div class="text-gray-300 mb-4 whitespace-pre-wrap">${comment.content}</div>
                <div class="flex gap-2 mb-4 flex-wrap">
                    ${mentionsHtml}
                </div>
                ${!isReply ? `
                    <div class="flex items-center gap-4 mb-4">
                        <button onclick="showReplyForm(${comment.id})" class="text-xs text-gray-400 hover:text-orange-500 transition">
                            <i class="fas fa-reply mr-1"></i> Rispondi
                        </button>
                        ${comment.reply_count > 0 ? `
                            <button onclick="toggleReplies(${comment.id})" class="text-xs text-gray-400 hover:text-orange-500 transition">
                                <i class="fas fa-comments mr-1"></i> Mostra ${comment.reply_count} risposte
                            </button>
                        ` : ''}
                    </div>
                    <div id="${repliesContainerId}" class="reply-thread hidden"></div>
                ` : ''}
            `;

            return div;
        }

        function toggleReplies(commentId) {
            const repliesContainer = document.getElementById(`replies-${commentId}`);
            if (!repliesContainer) return;

            if (repliesContainer.classList.contains('hidden')) {
                repliesContainer.classList.remove('hidden');
                loadReplies(commentId, `replies-${commentId}`);
            } else {
                repliesContainer.classList.add('hidden');
            }
        }

        function loadMoreComments() {
            if (!currentMangaId) return;
            
            currentPage++;
            
            fetch(`${COMMENTS_API}/manga/${currentMangaId}?page=${currentPage}&limit=10${userWallet ? `&wallet=${userWallet}` : ''}`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('comments-container');
                    data.comments.forEach(comment => {
                        const commentEl = createCommentElement(comment);
                        container.appendChild(commentEl);
                    });
                    
                    hasMore = data.hasMore || false;
                    document.getElementById('load-more').classList.toggle('hidden', !hasMore);
                })
                .catch(err => console.error('Error loading more comments:', err));
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        window.addEventListener('load', () => {
            loadMangaForMentions();
            setupMentionAutocomplete();
            
            // Controlla se c'è un manga ID nella URL
            const params = new URLSearchParams(window.location.search);
            const mangaId = params.get('mangaId');
            if (mangaId) {
                document.getElementById('manga-filter').value = mangaId;
                loadComments();
            }
        });

        // Esponi funzioni globali
        window.connectWallet = connectWallet;
        window.postComment = postComment;
        window.loadComments = loadComments;
        window.voteComment = voteComment;
        window.showReplyForm = showReplyForm;
        window.cancelReply = cancelReply;
        window.submitReply = submitReply;
        window.toggleReplies = toggleReplies;
        window.loadMoreComments = loadMoreComments;
    </script>
</body>
</html>
